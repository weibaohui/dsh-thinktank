<!doctype html>
<html>
<head><meta charset="utf-8"><style>body{margin:0;background:#f6f7f9;font-family:-apple-system,"PingFang SC",sans-serif}</style></head>
<body>
<div id="root"></div>
<pre id="log" style="position:fixed;left:0;bottom:0;max-height:40vh;overflow:auto;background:#fff;border-top:1px solid #ccc;font-size:11px;margin:0;padding:4px;width:100%"></pre>
<script>
  const slog = (m) => { document.getElementById('log').textContent += m + '\n' }
  window.addEventListener('error', (e) => slog('PAGE-ERROR: ' + e.message))
  const responses = {
    'GET /dsh-thinktank/api/config': { entry: 'sidebar' },
    'GET /dsh-thinktank/api/status': { storage: 'domain', storageError: '', agentsAvailable: true, modelCount: 161, categories: 9, jobsRunning: 0 },
    'GET /dsh-thinktank/api/reports': { reports: [] },
    'POST /dsh-thinktank/api/analyze': { jobId: 'j1', batches: 2 },
    'POST /dsh-thinktank/api/grill': { id: 'g1' },
    'GET /dsh-thinktank/api/jobs': { jobs: [{
      id: 'j1', status: 'running', question: '要不要出海？', createdAt: '2026-10-01T00:00:00Z',
      modelCount: 6, resultsCount: 2, synthesisStatus: 'pending', durationMs: 12000,
      batches: [
        { index: 0, status: 'done', count: 2, models: ['swot', 'pestel'] },
        { index: 1, status: 'running', count: 0, models: ['hook', 'fogg', 'mvp', 'pmf'] },
      ],
      results: [
        { id: 'swot', verdict: '优势足以支撑试点', signal: 'positive', insights: [], actions: [] },
        { id: 'pestel', verdict: '政策窗口期已到', signal: 'risk', insights: [], actions: [] },
      ],
    }] },
  }
  let aiPolls = 0
  let grillPolls = 0
  const dynamic = (key) => {
    if (key === 'POST /dsh-thinktank/api/ai-recommend') return { status: 202, body: { id: 'rec1' } }
    if (key.indexOf('GET /dsh-thinktank/api/grill') === 0) {
      grillPolls++
      if (grillPolls < 2) return { status: 200, body: { id: 'g1', status: 'running', textTail: '正在设计拷问…', questions: [], elapsedMs: 1000 } }
      return { status: 200, body: { id: 'g1', status: 'done', questions: [
        { q: '预算上限是真约束还是意愿值？', why: '逼出硬约束' },
        { q: '转型失败的一年内你能承受什么？', why: '最坏承受力' },
      ], textTail: '完成', elapsedMs: 3000 } }
    }
    if (key.indexOf('GET /dsh-thinktank/api/ai-recommend') === 0) {
      aiPolls++
      if (aiPolls < 2) return { status: 200, body: { id: 'rec1', status: 'running', textTail: '正在阅读模型库…\n先看宏观类：PESTEL、波特五力…', picks: [], elapsedMs: 1000 } }
      return { status: 200, body: { id: 'rec1', status: 'done', picks: [{ id: 'pestel', reason: '转型先看宏观政策与技术周期' }, { id: 'hook', reason: 'AI 产品要考虑习惯留存' }], rationale: '先宏观后产品，先趋势后执行', textTail: '完成', elapsedMs: 3000 } }
    }
    return null
  }
  window.fetch = async (url, opts) => {
    const method = (opts && opts.method) || 'GET'
    const key = method + ' ' + String(url)
    slog('FETCH ' + key)
    const dyn = dynamic(key)
    if (dyn) return { ok: true, status: dyn.status, json: async () => dyn.body }
    const body = responses[key]
    return { ok: body !== undefined, status: body !== undefined ? 200 : 404, json: async () => body !== undefined ? body : { error: 'not found' } }
  }
  let factoryEntry = null
  window.__ModuleLoader__ = { load: (e) => { factoryEntry = e; slog('MODULE-LOADED ' + e.id) } }
</script>
<script src="./vendor-react.min.js"></script>
<script src="./vendor-react-dom.min.js"></script>
<script src="../client/bundle.js"></script>
<script>
  ;(async () => {
  const requireStub = (name) => {
    if (name === 'react') return window.React
    throw new Error('unexpected require: ' + name)
  }
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms))
  const btn = (txt) => [...document.querySelectorAll('button')].find((b) => b.textContent.includes(txt))
  const tabBy = (txt) => [...document.querySelectorAll('.dshmm-tab')].find((t) => t.textContent === txt)
  const setTextarea = (el, v) => {
    const setter = Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, 'value').set
    setter.call(el, v)
    el.dispatchEvent(new Event('input', { bubbles: true }))
  }
  const ok = (name, cond) => slog(name + '=' + cond)
  try {
    const mod = factoryEntry.factory(requireStub)
    slog('FACTORY-OK exports keys=' + Object.keys(mod).join(','))
    const regs = []
    const slots = {
      inject: (name, fn) => { slog('INJECT ' + name); try { const d = fn(); return () => { try { if (typeof d === 'function') d() } catch {} } } catch (e) { slog('INJECT-FAIL ' + name + ' ' + e.message); return () => {} } },
      register: (meta, render) => { regs.push({ meta, render }); slog('REGISTER ' + meta.name + ' id=' + (meta.id || meta.key || '')); return () => {} },
    }
    const ctx = { get: (n) => (n === 'slots' ? slots : undefined), effect: () => {} }
    mod.apply(ctx)
    const main = regs.find((r) => r.meta && r.meta.name === 'main')
    if (!main) { slog('NO-MAIN-REGISTRATION') } else {
      window.ReactDOM.createRoot(document.getElementById('root')).render(main.render())
    }
    await sleep(1500)
    const root = () => document.getElementById('root')

    // S1：第 1 步，填问题
    ok('S1 steps=' + root().querySelectorAll('.dshmm-step').length, root().querySelectorAll('.dshmm-step').length === 4)
    ok('S1 model-cards=0', root().querySelectorAll('.dshmm-model').length === 0)
    setTextarea(root().querySelector('textarea'), '公司要不要 All in AI 转型？')
    const next1 = btn('下一步')
    if (next1) next1.click()
    await sleep(600)

    // S2：拷问澄清（可跳过）——走真实交互：AI 拷问 → 回答 → 并入背景
    ok('S2 step2-active=' + (root().textContent || '').includes('澄清意图'))
    ok('S2 skip-btn=' + !!btn('跳过，直接选模型'))
    const grillBtn = btn('让 AI 拷问我')
    ok('S2 grill-btn=' + !!grillBtn)
    if (grillBtn) grillBtn.click()
    await sleep(2300) // 两次 1s 轮询后 done
    const answers = root().querySelectorAll('.dshmm-card textarea')
    ok('S2 questions=' + answers.length)
    if (answers.length) setTextarea(answers[0], '预算上限 500 万，只投一年')
    await sleep(200)
    const merge = btn('条回答并入背景')
    ok('S2 merge-btn=' + !!merge)
    if (merge) merge.click()
    await sleep(500)

    // S3：选择模型（161 张卡，默认 0 选中）
    ok('S3 model-cards=' + root().querySelectorAll('.dshmm-model').length)
    ok('S3 sel-default=0', root().querySelectorAll('.dshmm-model.sel').length === 0)
    const card = root().querySelector('.dshmm-model:not(.sel)')
    if (card) card.click()
    const kw = btn('关键词匹配')
    if (kw) kw.click()
    await sleep(200)
    ok('S25 notice=' + !!root().querySelector('.dshmm-notice'))
    ok('S25 onlyRec-active=' + [...root().querySelectorAll('.dshmm-chip')].some((c) => c.textContent.includes('只看推荐') && c.classList.contains('active')))
    ok('S25 rec-badges=' + root().querySelectorAll('.dshmm-rec').length)

    // S26：AI 智能推荐弹窗
    const aiBtn = btn('AI 智能推荐')
    if (aiBtn) aiBtn.click()
    await sleep(300)
    ok('S26 modal=' + !!root().querySelector('.dshmm-modal'))
    await sleep(2400) // 两次轮询后 done
    ok('S26 picks=' + root().querySelectorAll('.dshmm-modal .dshmm-model').length)
    const apply = btn('采用所选')
    if (apply) apply.click()
    await sleep(400)
    ok('S26 modal-closed=' + !root().querySelector('.dshmm-modal'))

    // S4：确认页——背景含澄清问答、点 × 移除、提交
    const nextBtn = btn('下一步')
    if (nextBtn) nextBtn.click()
    await sleep(600)
    const text = root().textContent || ''
    ok('S4 confirm=' + text.includes('将使用'))
    ok('S4 grill-merged=' + text.includes('澄清问答') && text.includes('预算上限 500 万'))
    const n = Number((text.match(/将使用 (\d+) 个思维模型/) || [0, 0])[1])
    ok('S4 chips-sync=' + (root().querySelectorAll('.dshmm-sum-m').length === n))
    const x = root().querySelector('.dshmm-sum-m .x')
    if (x) x.click()
    await sleep(200)
    ok('S4 chip-removed=' + (root().querySelectorAll('.dshmm-sum-m').length === n - 1))
    const auto = btn('开始自动分析')
    if (auto) auto.click()
    await sleep(900)

    // S5：自动跳历史页 + 实时任务卡片
    ok('S5 auto-nav-history=' + [...root().querySelectorAll('.dshmm-tab')].some((t2) => t2.classList.contains('active') && t2.textContent === '历史'))
    ok('S5 live-card=' + !!root().querySelector('.dshmm-live'))
    ok('S5 running=' + (root().textContent || '').includes('进行中'))
    ok('S5 results=' + (root().textContent || '').includes('SWOT 分析'))
    ok('S5 cancel=' + !!btn('取消'))

    // S6：回分析页——向导已重置
    const at = tabBy('分析')
    if (at) at.click()
    await sleep(400)
    const ta = root().querySelector('textarea')
    ok('S6 reset-step1=' + (root().querySelector('.dshmm-step.active') || { textContent: '' }).textContent.includes('输入问题'))
    ok('S6 question-cleared=' + (ta ? ta.value === '' : false))
    ok('PANEL-ERRORS=' + (globalThis.__dshThinktankErrors || []).length)
    document.title = 'HARNESS-DONE'
  } catch (e) { slog('HARNESS-FAIL ' + ((e && e.stack) || e)) }
  })();
</script>
</body>
</html>
